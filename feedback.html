<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback - Assignment Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>

footer{
    background-color: #212529;
    color: white;
    text-align: center;
    padding: 15px;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="#">Assignment Tracker</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">

<ul class="navbar-nav ms-auto" id="navbar-items">

</ul>

</div>
</div>
</nav>

<div class="container">

<div class="feedback-header">
<h1>Feedback</h1>
<p>We'd love to hear from you</p>
</div>

<div class="feedback-form">

<form>

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" placeholder="Enter your full name">
</div>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" placeholder="Enter your email">
</div>

<div class="mb-3">
<label class="form-label">Your Feedback</label>
<textarea class="form-control" rows="6" placeholder="Write your message here..."></textarea>
</div>

<button type="submit" class="btn btn-primary w-100">
Submit Feedback
</button>

</form>

</div>

</div>

<footer>
<p>&copy; 2026 Floid Sam</p>
</footer>

<script>

document.addEventListener("DOMContentLoaded", function() {

    const navbar = document.getElementById("navbar-items");
    const currentUser = localStorage.getItem("currentUser");

    if (currentUser) {

        navbar.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="tips.html">Tips</a></li>
            <li class="nav-item"><a class="nav-link" href="add.html">Add</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a></li>
            <li class="nav-item"><span class="navbar-text text-white me-2">Welcome, ${currentUser}</span></li>
            <li class="nav-item"><button class="btn btn-danger" onclick="logout()">Logout</button></li>
        `;

    } else {

        navbar.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="tips.html">Tips</a></li>
            <li class="nav-item"><a class="nav-link" href="add.html">Add</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a></li>
            <li class="nav-item"><a class="btn btn-primary me-2" href="login.html">Login</a></li>
            <li class="nav-item"><a class="btn btn-success" href="signup.html">Signup</a></li>
        `;

    }

});

function logout() {
    localStorage.removeItem("currentUser");
    location.reload();
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
