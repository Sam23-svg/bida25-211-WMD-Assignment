<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Assignment Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Assignment Tracker</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="tips.html">Tips</a></li>
        <li class="nav-item"><a class="nav-link" href="add.html">Add</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="d-flex justify-content-center align-items-center" style="height:80vh;">
  <div class="p-4 bg-white rounded shadow" style="width: 100%; max-width: 400px; text-align:center;">
    <h2>Login</h2>
    <input type="text" id="loginUser" placeholder="Username" class="form-control my-2">
    <input type="password" id="loginPass" placeholder="Password" class="form-control my-2">
    <button onclick="login()" class="btn btn-primary w-100 my-2">Login</button>
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const navbar = document.querySelector(".navbar-nav");
    const currentUser = localStorage.getItem("currentUser");

    if (currentUser) {
        navbar.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="tips.html">Tips</a></li>
            <li class="nav-item"><a class="nav-link" href="add.html">Add</a></li>
            <li class="nav-item"><span class="navbar-text text-white me-2">Welcome, ${currentUser}</span></li>
            <li class="nav-item"><button class="btn btn-danger" onclick="logout()">Logout</button></li>
        `;
    }
});

function login() {
    const username = document.getElementById("loginUser").value.trim();
    const password = document.getElementById("loginPass").value.trim();
    if (!username || !password) { alert("Please fill in both fields."); return; }

    const users = JSON.parse(localStorage.getItem("users")) || [];
    const user = users.find(u => u.username === username && u.password === password);

    if (user) {
        localStorage.setItem("currentUser", username);
        alert("Login successful!");
        window.location.href = "index.html";
    } else {
        alert("Invalid username or password.");
    }
}

function logout() {
    localStorage.removeItem("currentUser");
    location.reload();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
