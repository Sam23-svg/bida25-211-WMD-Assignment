        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

                <a class="navbar-brand" href="index.html">ADD</a>

                    <span class="navbar-toggler-icon"></span>

        </nav>
    </header>

    <div class="container mt-4">
        <h4 class="mb-4">Add New Assignment</h4>
        <div class="card shadow p-4">
            <form>
                <div class="mb-3">
                    <label class="form-label">Assignment Title</label>
                    <input type="text" class="form-control" placeholder="Enter assignment title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" placeholder="Enter subject name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="date" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select class="form-select">
                        <option>High</option>
                        <option>Medium</option>
                        <option>Low</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="3" placeholder="Enter assignment details"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Add Assignment
                </button>
            </form>
        </div>
    </div>

    <main class="container my-5">
        <h2>Add New Assignments</h2>
        <p>Assignments are your responsibilities. Take action now and manage your academic tasks efficiently.</p>
    </main>
