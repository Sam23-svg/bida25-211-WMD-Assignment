<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment Tracker - Add Assignment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    font-family: Arial, sans-serif;
}

header h1{
    text-align:center;
    margin-top:20px;
}
</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="#">Assignment Tracker</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto" id="navbar-items">

</ul>
</div>

</div>
</nav>

<header>
<h1 class="text-center mt-4">Add New Assignment</h1>
</header>

<div class="container mt-5">

<div class="card shadow p-4">

<form id="assignmentForm">

<input type="text" id="title" placeholder="Assignment Title" class="form-control mb-3" required>

<input type="text" id="subject" placeholder="Subject" class="form-control mb-3" required>

<input type="date" id="due" class="form-control mb-3" required>

<select id="priority" class="form-select mb-3">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>

<textarea id="desc" placeholder="Description" class="form-control mb-3"></textarea>

<button type="submit" class="btn btn-primary w-100">
Add Assignment
</button>

</form>

</div>

<h5 class="mt-5">Your Assignments</h5>

<ul id="assignmentList" class="list-group mt-2"></ul>

</div>

<footer class="text-center py-3 mt-5 bg-light">
&copy; 2026 Floid Sam
</footer>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const navbar = document.getElementById("navbar-items");
    const currentUser = localStorage.getItem("currentUser");

    if (currentUser) {
        navbar.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="tips.html">Tips</a></li>
            <li class="nav-item"><a class="nav-link active" href="add.html">Add</a></li>
            <li class="nav-item"><a class="nav-link active" href="about.html">About</a><li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a><li>
            <li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a><li>
            <li class="nav-item"><span class="navbar-text text-white me-2">Welcome, ${currentUser}</span></li>
            <li class="nav-item"><button class="btn btn-danger" onclick="logout()">Logout</button></li>
        `;
    } else {
        navbar.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="tips.html">Tips</a></li>
            <li class="nav-item"><a class="nav-link active" href="add.html">Add</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a><li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a><li>
            <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a><li>
            <li class="nav-item"><a class="btn btn-primary me-2" href="login.html">Login</a></li>
            <li class="nav-item"><a class="btn btn-success" href="signup.html">Sign Up</a></li>
        `;
    }
});

function logout() {
    localStorage.removeItem("currentUser");
    location.reload();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form = document.getElementById('assignmentForm');
const list = document.getElementById('assignmentList');

const assignments = JSON.parse(localStorage.getItem('assignments')) || [];

assignments.forEach(a => addAssignmentToList(a));

form.addEventListener('submit', function(e){
    e.preventDefault();

    const assignment = {
        title: document.getElementById('title').value,
        subject: document.getElementById('subject').value,
        due: document.getElementById('due').value,
        priority: document.getElementById('priority').value,
        desc: document.getElementById('desc').value
    };

    assignments.push(assignment);
    localStorage.setItem('assignments', JSON.stringify(assignments));
    addAssignmentToList(assignment);
    form.reset();
});

function addAssignmentToList(a){
    const li = document.createElement('li');
    li.className = 'list-group-item';
    li.innerHTML = `<strong>${a.title}</strong> - ${a.subject} | Due: ${a.due} | Priority: ${a.priority}<br>${a.desc}`;
    list.appendChild(li);
}
</script>

</body>
</html>
